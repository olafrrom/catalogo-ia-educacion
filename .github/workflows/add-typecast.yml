name: Add Typecast

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-typecast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-typecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Typecast to catalog
        run: python3 scripts/add_typecast.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Agregar Typecast al catálogo"
            git push
          fi
