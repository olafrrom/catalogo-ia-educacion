name: Install Umami Analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install-umami.yml']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Umami tracking
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-website-id="72622334-8d6b-48ba-bbff-8eeac76b91c0"'
          tag = '<script defer src="https://cloud.umami.is/script.js" data-website-id="72622334-8d6b-48ba-bbff-8eeac76b91c0"></script>'
          if marker not in s:
              s = s.replace('</head>', '  ' + tag + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Agregar Umami Analytics"
            git push
          fi
