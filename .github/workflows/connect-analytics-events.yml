name: Connect analytics events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-analytics-events.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add analytics events script to index
        run: |
          if ! grep -q 'analytics-events.js' index.html; then
            perl -0pi -e 's#</body>#  <script src="./analytics-events.js"></script>\n</body>#' index.html
          fi

      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Conectar eventos de Umami al catálogo"
            git push
          fi
